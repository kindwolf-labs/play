<style>
:root {
  color-scheme:dark;
  --base:#0e1020;--surface:#15192d;--muted:#abb1ce;--text:#f7f6fb;--line:#303651;
  --accent:#c8adff;--deep:#252143;--accent-ink:#171025;
  font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
  font-size:16px;
}
*{box-sizing:border-box}
body{margin:0;min-width:320px;background:radial-gradient(ellipse at 70% 1%,var(--deep) 0%,var(--base) 57%);color:var(--text);min-height:100vh}
button,a{-webkit-tap-highlight-color:transparent}
button{color:inherit;font:inherit}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:4px}
button:not(:disabled){cursor:pointer}
button:disabled{opacity:.48;cursor:default}
h1,h2,h3,p{margin:0}
.topbar{max-width:1212px;margin:auto;padding:15px 32px;border-bottom:1px solid #ffffff16;display:flex;justify-content:space-between;align-items:center}
.brand{display:inline-flex;align-items:center;gap:11px;font-size:.82rem;letter-spacing:.15em;font-weight:900;white-space:nowrap}
.brand i{width:34px;height:34px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-style:normal;display:grid;place-content:center;font-size:1.25rem;box-shadow:0 4px 0 #0005}
.top-actions,.title-buttons,.room-tools,.utility,.result-actions,.voxel-controls{display:flex;gap:8px;align-items:center}
.icon,.quiet,.primary{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid transparent;border-radius:12px;min-height:42px;padding:8px 14px;font-weight:750;line-height:1.15}
.icon,.quiet{background:#14172b;border-color:#424962}
.icon:hover:not(:disabled),.quiet:hover:not(:disabled){background:#272c46;border-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:#fff3;box-shadow:0 4px 0 #07091570}
.primary:hover:not(:disabled){filter:brightness(1.1)}
.primary:active:not(:disabled){translate:0 2px;box-shadow:0 1px 0 #0005}
.icon{min-width:42px}
.eyebrow{color:var(--accent);font-size:.82rem;font-weight:850;letter-spacing:.12em}
.lobby,.cabinet{max-width:1212px;margin:0 auto;padding:22px 32px 40px}
.hero{display:grid;grid-template-columns:1fr 1.43fr;align-items:center;overflow:hidden;min-height:365px;background:#11112d;border:1px solid #4c4266;border-radius:26px;box-shadow:0 26px 80px #03041370;margin-bottom:31px}
.hero img{width:100%;height:100%;aspect-ratio:1.65;object-fit:cover;align-self:stretch}
.hero-copy{padding:30px 0 37px 38px;z-index:1}
.hero-copy h1{font-size:clamp(2.55rem,5.2vw,4.6rem);line-height:1.04;letter-spacing:-.065em;margin:10px 0 16px}
.hero-copy p:not(.eyebrow){line-height:1.57;color:#ced1e8;max-width:32ch}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.library{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:12px}
.game-card{background:#171a30;border:1px solid #383e5c;border-radius:16px;overflow:hidden;transition:transform .18s,border .18s}
.game-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.game-card>div{padding:12px;display:flex;flex-direction:column;min-height:145px}
.game-card small{color:var(--accent);font-weight:700;font-size:.77rem}
.game-card h3{font-size:1.14rem;margin:5px 0}
.game-card p{font-size:.85rem;color:#bbc2dd;line-height:1.45;margin-bottom:10px}
.card-play{color:var(--accent);font-weight:850;margin-top:auto;font-size:.87rem}
.thumb{height:112px;display:block;overflow:hidden;background:var(--deep)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.echo{--accent:#ffe1a0;--deep:#312b45;--accent-ink:#281910}
.voxel{--accent:#d2aeff;--deep:#2b1a59;--accent-ink:#1c1138}
.parcel{--accent:#ffab9c;--deep:#49234d;--accent-ink:#310f25}
.ferry{--accent:#9ff0e9;--deep:#113c4d;--accent-ink:#0d2c3c}
.switch{--accent:#fbe28e;--deep:#37401f;--accent-ink:#272312}
.game-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:1px 0 17px}
.game-title h1{font-size:clamp(1.9rem,4vw,3.25rem);letter-spacing:-.055em;line-height:1.12;margin-top:4px}
.play-layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:16px;align-items:start}
#stage,#panel{min-width:0}
#panel{background:linear-gradient(145deg,#1b2038,#14182a);border:1px solid #3a3f5d;border-radius:20px;padding:17px}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:12px;border-bottom:1px solid #3b405b}
.level{color:var(--accent);font-weight:800;font-size:.91rem}
.level b{font-size:1.23rem;color:#fff;margin-left:4px}
.level span,.move-count{color:var(--muted);font-size:.85rem}
.instruction{color:#e2e5fa;font-size:.95rem;line-height:1.55;margin:14px 0}
.mobile-instruction{display:none}
.game-panel{margin-bottom:13px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.metric{padding:10px 9px;background:#101426;border:1px solid #343a55;border-radius:10px;display:grid;gap:4px}
.metric span{font-size:.74rem;letter-spacing:.05em;color:#c0c7e8;font-weight:750}
.metric strong{font-size:1.35rem;color:var(--accent);line-height:1.1}
.metric strong i{font-size:.77rem;color:var(--muted);font-style:normal;font-weight:600}
.feedback{min-height:1.4em;font-size:.88rem;color:var(--accent);margin-top:10px}
.game-guide,.game-footer{max-width:68ch;margin:22px 0 0;color:var(--muted);font-size:.91rem;line-height:1.55}
.game-guide{padding-top:13px;border-top:1px solid var(--line)}
.game-guide h2{font-size:1.05rem;color:var(--text);margin-bottom:.3em}
.game-guide a,.game-footer a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.room{border:1px solid color-mix(in srgb,var(--accent),#17182c 72%);border-radius:22px;min-height:474px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:19px 16px;gap:17px;overflow:hidden;position:relative}
.highlight{animation:ping 1s alternate infinite;outline:3px solid #fff69b!important;outline-offset:2px;z-index:2}
@keyframes ping{to{outline-color:#fff;filter:brightness(1.13)}}
.relic.fresh,.dispatch.fresh,.switch-tile.fresh{animation:pop .36s ease-out}
@keyframes pop{20%{scale:1.06;filter:brightness(1.6)}100%{scale:1;filter:brightness(1)}}
.merge-room,.deduction{background:radial-gradient(ellipse at 50% 25%,#554a5d,#231e30 64%,#191725);box-shadow:inset 0 0 80px #171327}
.room-caption{max-width:420px;text-align:center;font-size:.92rem;line-height:1.5;color:#fae9cb}
.room-caption span{color:var(--accent);margin-right:4px}
.evidence-targets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.evidence-targets span{font-size:.79rem;color:#ffe5ae;background:#291f34;border:1px solid #74637c;border-radius:7px;padding:5px 8px}
.evidence-targets .filed{color:#c4eeb2;border-color:#6d8e69}
.merge-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:min(100%,355px);padding:9px;border-radius:15px;background:#180f265e;border:1px solid #6b5577}
.relic{aspect-ratio:1;min-width:0;border:1px solid #847369;border-radius:11px;padding:4px 1px;display:grid;place-content:center;gap:1px;background:linear-gradient(150deg,#514435,#352f3f);color:#fff3c3;box-shadow:0 3px 0 #190e21;text-align:center}
.family-1{background:linear-gradient(150deg,#3c5163,#293447);color:#d5ecff;border-color:#617992}
.family-2{background:linear-gradient(150deg,#46554d,#2a3c40);color:#d6f6bf;border-color:#6a8779}
.relic:hover{filter:brightness(1.16)}
.relic.selected{outline:2px solid var(--accent);background-color:#76515a;filter:brightness(1.26)}
.relic b{font-size:clamp(1.3rem,4vw,2rem);line-height:1}
.relic span{font-size:.72rem;line-height:1.12;padding:2px}
.relic.empty{background:#282139;color:#8e7b9f;border-color:#4d4060;box-shadow:none}
.relic.empty span{font-size:1.1rem}
.room-tools{justify-content:center;flex-wrap:wrap}
.room-tools small{color:inherit;opacity:.75}
.case-file{background:#231d2a;border:1px solid #4e4257;padding:12px;border-radius:12px}
.case-file h3{margin:4px 0 11px;font-size:1.1rem}
.order-line{display:grid;grid-template-columns:31px 1fr 17px;gap:7px;align-items:center;margin-top:7px;color:#f3e8d9}
.relic-emblem{height:28px;display:grid;place-content:center;border:1px solid #776b66;border-radius:7px;color:var(--accent);background-color:#614c3b}
.order-line b{color:var(--accent);font-size:1rem}
.clue-card{max-width:440px;width:100%;padding:19px;border-radius:17px;background:#211e2e;border:1px solid #856b78}
.clue-card h2{font-size:1.45rem;margin:6px 0 15px}
.evidence{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.evidence div,.suspects button{display:grid;gap:5px;background:#363042;border:1px solid #6a5e74;border-radius:10px;padding:10px}
.evidence span,.suspects span{font-size:.85rem;color:#e1cdbd}
.evidence strong{color:var(--accent)}
.suspects{margin-top:12px;display:grid;gap:7px}
.suspects button{text-align:left}
.suspects button:hover{background:#564053;border-color:var(--accent)}
.voxel-room{padding:8px 10px 17px;gap:0;background:radial-gradient(ellipse at 52% 38%,#302060,#1e1a3a 61%,#110f26);min-height:0}
.voxel-label{padding:8px 0 0;color:#ebddff;font-size:.75rem;font-weight:800;letter-spacing:.08em}
.voxel-label span{color:var(--accent);padding-right:4px}
#sculpture{display:block;width:min(100%,382px);aspect-ratio:1;height:auto;touch-action:none;cursor:grab}
#sculpture:active{cursor:grabbing}
.voxel-controls{margin-top:-10px}
.voxel-controls .quiet{font-size:1.15rem}
.charges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.charge{border:1px solid #626181;display:flex;align-items:center;gap:4px;background:#17192d;border-radius:9px;min-width:44px;padding:5px;font-weight:800}
.charge.selected{border-color:#fff;box-shadow:0 0 0 2px var(--accent);background:#3c3158}
.charge small{color:#fff;font-size:.7rem}
.mark{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:7px;background:var(--piece);color:#241e38;font-size:1.04rem;font-weight:900;box-shadow:inset 0 1px 0 #fff8,0 2px 0 #0005}
.parcel-room{background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 32px),radial-gradient(ellipse at 50% 30%,#773e64,#3e244b 62%,#2c1c37);gap:40px}
.dispatch{display:flex;gap:15px;align-items:center;justify-content:center;border:1px solid #cf8a9b;border-radius:17px;background:#21182ee8;padding:14px 18px;box-shadow:0 8px 0 #170e2b82}
.dispatch-sign{display:flex;align-items:center;gap:8px}
.dispatch-sign>span{color:#ffbcae;font-size:1.75rem}
.dispatch-sign strong,.dispatch-sign small{display:block;font-weight:800;font-size:.77rem;letter-spacing:.05em}
.dispatch-sign small{color:#f0bac4;margin-top:3px}
.tray{display:flex;gap:5px}
.tray .mark,.tray-hole{display:grid;place-content:center;width:39px;height:39px;border-radius:9px}
.tray-hole{border:1px dashed #927694;color:#e3aebe;font-size:1.1rem;background:#151025}
.stacks{width:min(100%,570px);display:grid;grid-template-columns:repeat(var(--columns),1fr);gap:8px;padding:0 5px 15px}
.stack{min-width:0;text-align:center;min-height:110px}
.stack>small{color:#fff5df;background:#36243e;border-radius:9px;padding:3px 8px;font-weight:800}
.parcel-pile{position:relative;isolation:isolate;margin-top:12px;padding-bottom:calc(var(--layers) * 7px)}
.box{display:grid;place-content:center;width:100%;aspect-ratio:1.04;border-radius:11px;color:#281c30;background:linear-gradient(140deg,#ffffff4d,transparent 48%),var(--piece);border:1px solid #fbe8ef8c;box-shadow:inset 0 -6px 0 #0003,0 3px 0 #220c2e8c}
.box b{font-size:clamp(.95rem,4vw,1.8rem)}
.parcel-box:hover{filter:brightness(1.12);translate:0 -2px}
.box.under{position:absolute;top:calc(var(--offset) * 7px);z-index:-1;filter:brightness(.82)}
.box.absent{background:#0002;border:1px dashed #d2a4bc;color:#f6bdce;box-shadow:none}
.ferry-room{padding:12px 11px;background:radial-gradient(ellipse at 48% 33%,#136377,#174152 61%,#152d41);gap:10px}
.passenger-area{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;width:min(100%,465px);padding:6px 8px;background:#102439;border:1px solid #427289;border-radius:10px}
.passenger-area strong{font-size:.72rem;letter-spacing:.05em;color:#c6f7f6}
.passengers{display:flex;align-items:center;gap:3px;min-height:25px}
.passenger{width:20px;height:23px;border-radius:10px 10px 6px 6px;background:var(--piece);color:#132637;display:grid;place-content:center;font-size:.77rem;font-weight:800;border:1px solid #ffffff55}
.passenger.first{outline:2px solid #fff;outline-offset:1px}
.passengers small{font-size:.72rem}
.lot{--road-gap:3px;--road-pad:8px;--cell:calc((100% - 2 * var(--road-pad) - (var(--side) - 1) * var(--road-gap))/var(--side));width:min(100%,365px);display:grid;grid-template-columns:repeat(var(--side),1fr);gap:var(--road-gap);padding:var(--road-pad);background:#122638;border-radius:13px;border:1px solid #577e90;position:relative;overflow:hidden}
.parking,.shuttle{width:100%;min-width:0;aspect-ratio:1;border-radius:7px}
.parking{background:#1a3447;border:1px dashed #456373}
.shuttle{display:grid;place-content:center;text-align:center;line-height:1;gap:4px;padding:1px;background:linear-gradient(150deg,#fff8 0%,transparent 60%),var(--piece);color:#172a3d;border:1px solid #fff7;box-shadow:inset 0 -4px #0003,0 2px 0 #030d16;position:relative}
.shuttle::before,.shuttle::after{content:"";background:#162a403c;position:absolute;bottom:12%;width:12%;height:24%;border-radius:20%;pointer-events:none}
.shuttle::before{left:7%}.shuttle::after{right:7%}
.shuttle.moving{position:absolute;top:calc(var(--road-pad) + var(--row)*(var(--cell) + var(--road-gap)));left:calc(var(--road-pad) + var(--col)*(var(--cell) + var(--road-gap)));width:var(--cell);z-index:3;pointer-events:none;opacity:0;animation:roll-away .4s cubic-bezier(.4,0,.8,.9)}
@keyframes roll-away{0%{opacity:1;transform:translate(0,0)}86%{opacity:1}100%{opacity:0;transform:translate(calc(var(--reach)*var(--dx)*106%),calc(var(--reach)*var(--dy)*106%))}}
.shuttle span{font-size:clamp(1.05rem,3.8vw,1.6rem);font-weight:900}
.shuttle small{font-size:clamp(.67rem,2.6vw,.88rem);font-weight:900}
.shuttle.blocked{background:linear-gradient(#18263849,#18263849),var(--piece);border-color:#ffffff42;color:#0e2333}
.shuttle:hover{filter:brightness(1.13)}
.berths{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.berth{border:1px dashed #76a6b3;border-radius:8px;padding:7px 9px;color:#c5edee;background:#142737;min-width:63px;text-align:center;font-size:.78rem}
.berth.in-use{background:var(--piece);color:#1b2e3d;font-weight:850;border:1px solid #fff8}
.circuit-room{background:radial-gradient(ellipse at 46% 31%,#444a31,#26322d 58%,#202a2a);gap:13px}
.circuit-grid{width:min(100%,398px);display:grid;grid-template-columns:repeat(var(--side),1fr);gap:3px;background:#141e20;border:1px solid #656f50;border-radius:15px;padding:9px;box-shadow:0 9px 0 #0d1719a0}
.switch-tile{aspect-ratio:1;border-radius:8px;min-width:0;padding:0;position:relative;display:grid;place-content:center;color:#91a69a;background:linear-gradient(135deg,#405348,#2b3a38);border:1px solid #72827b;box-shadow:inset 0 -3px 0 #0004}
.switch-tile:disabled{opacity:1}
.switch-tile:hover:not(:disabled){filter:brightness(1.2)}
.switch-tile.lit{color:#ffe699;border-color:#cfbe77;background:linear-gradient(135deg,#534e37,#3c4035)}
.wire{position:absolute;display:block;background:currentColor;opacity:.88}
.wire-0,.wire-2{height:50%;width:13%;left:43.5%}
.wire-0{top:0}.wire-2{bottom:0}
.wire-1,.wire-3{width:50%;height:13%;top:43.5%}
.wire-1{right:0}.wire-3{left:0}
.lit .wire{box-shadow:0 0 8px #ffdc81}
.socket{display:grid;place-content:center;position:relative;width:clamp(14px,5vw,28px);aspect-ratio:1;line-height:1;font-size:clamp(.76rem,3vw,1.18rem);border-radius:50%;border:2px solid currentColor;background:#263536;font-weight:900}
.hub .socket,.sink.lit .socket{background:var(--accent);color:#332c18;border-color:#fff4c6;box-shadow:0 0 14px #ffe7a693}
.circuit-legend{display:flex;gap:14px;justify-content:center;color:#efebbc;font-size:.82rem}
.veil{position:fixed;z-index:9;inset:0;background:#090b1cbe;backdrop-filter:blur(6px);display:grid;place-items:center;padding:15px}
.modal{position:relative;width:min(100%,510px);max-height:90vh;background:#1b2037;border:1px solid #606585;border-radius:20px;padding:18px;box-shadow:0 24px 85px #04050fcc}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:min(58vh,330px);overflow:auto;padding:5px}
.level-grid button{min-width:0;min-height:42px;border:1px solid #5d6584;border-radius:8px;background:#252b48;font-weight:750}
.level-grid button.current{background:var(--accent);color:var(--accent-ink)}
.result{text-align:center;padding:27px 16px}
.result .icon{position:absolute;right:9px;top:9px}
.result h2{margin:6px 0}
.result p:not(.eyebrow){color:#d5d8ed}
.stars{font-size:2.35rem;letter-spacing:.11em;color:var(--accent);text-shadow:0 0 20px #fdd99351}
.result-actions{justify-content:center;margin-top:17px;flex-wrap:wrap}
@media(max-width:880px){
  .library{grid-template-columns:repeat(3,minmax(0,1fr))}
  .play-layout{grid-template-columns:minmax(0,1fr) 245px;gap:10px}
  #panel{padding:12px}
  .topbar,.lobby,.cabinet{padding-left:18px;padding-right:18px}
  .hero-copy{padding-left:26px}
}
@media(max-width:645px){
  .topbar{padding:9px 12px}
  .lobby,.cabinet{padding:12px 10px 22px}
  .hero{grid-template-columns:1fr;min-height:0;border-radius:17px;margin-bottom:20px}
  .hero img{grid-row:1;max-height:235px;object-position:center 54%}
  .hero-copy{padding:11px 15px 16px}
  .hero-copy h1{font-size:2.7rem;margin:6px 0 8px}
  .hero-copy h1 br{display:none}
  .hero-actions{margin-top:11px}
  .library{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .thumb{height:81px}
  .game-card>div{padding:8px;min-height:0}
  .play-layout{display:flex;flex-direction:column}
  #stage,#panel{width:100%}
  .game-title{margin-bottom:10px}
  .game-title .quiet{padding:6px 9px;min-height:36px;font-size:.83rem;white-space:nowrap}
  .game-title .eyebrow{font-size:.72rem}
  .room{min-height:345px;padding:11px 8px;gap:10px;border-radius:15px}
  .voxel-room{padding:5px 5px 10px;gap:0;min-height:0}
  #sculpture{width:min(100%,340px)}
  .merge-grid{width:min(100%,294px)}
  .relic b{font-size:1.4rem}
  .relic span{font-size:.67rem}
  .parcel-room{gap:20px;min-height:272px}
  .dispatch{padding:9px;gap:7px}
  .tray .mark,.tray-hole{width:34px;height:34px}
  .dispatch-sign>span{display:none}
  .stacks{gap:5px;padding-left:0;padding-right:0}
  .ferry-room,.circuit-room{gap:7px;min-height:0}
  .lot{width:min(100%,330px);--road-gap:2px;--road-pad:4px}
  .circuit-grid{width:min(100%,330px);padding:5px}
  .passenger{width:18px;height:21px}
  #panel{border-radius:15px}

function startGame(item, level) {
  const progress = store.read(item.id,{open:1, stars:{}});
  const engine = engines[item.id];
  const current = level ?? Math.max(1,Math.min(campaignLength,Math.floor(Number(params.get('level'))||progress.open)));
  session = {item,engine,current,progress,history:[],moves:0,undos:0,hint:false,status:'playing',view:'',note:null,motion:null};

}
function active(name, fn, feedback=0) {
  const run=session;
  if (run.status !== 'playing') return;
  const before=structuredClone(run.state);
  if (!fn(run.state)) {
    tone(-1); renderPlay(); return;
  }
  run.history.push({state:before,moves:run.moves});
  run.moves++;
  const first = !run.started;
  run.started=true;
  run.hint=false;
  const status=run.engine.result?.(run.state) || 'playing';
  if (status === 'won') {
    const stars = Math.max(1,3-Math.min(2,run.undos+(run.engine.penalty?.(run.state,run.moves)||0)));
    run.status=status; run.stars=stars; run.view='result';
    run.progress.open=Math.min(campaignLength,Math.max(run.progress.open,run.current+1));
    run.progress.stars[run.current]=Math.max(stars,run.progress.stars[run.current]||0);
    store.write(run.item.id,run.progress);
  }
  if (status === 'lost') { run.status=status; run.view='result'; }
  tone(status==='won'?2:feedback);
  renderPlay();
  if (siteInfo && first) window.dispatchEvent(new CustomEvent('prototype-event',{detail:{game:run.item.id,event:'level_start'}}));
  if (siteInfo && status==='won') window.dispatchEvent(new CustomEvent('prototype-event',{detail:{game:run.item.id,event:'level_complete'}}));
}
function note(zh,en) { session.note=[zh,en]; }

      <span class="move-count">${run.moves} ${L('步','moves')}</span></div>

    <div class="utility">${act(L('撤销','Undo'),'undo','quiet',run.history.length&&run.status!=='won'?'':'disabled')}${engine.hint ? act(L('提示','Hint'),'hint','quiet',`aria-pressed="${run.hint}" ${run.status==='playing'?'':'disabled'}`):''}</div>

  else if (focused && !run.view) qs(`[data-action="${focused}"]:not(:disabled)`)?.focus({preventScroll:true});
}
function renderOverlay() {

      <div class="level-grid">${Array.from({length:campaignLength},(_,i)=>act(String(i+1)+(run.progress.stars[i+1]?' ★':''),'level-'+(i+1),run.current===i+1?'current':'',i+1>run.progress.open?'disabled':'')).join('')}</div></section></div>`;

function gameAction(name) {

    language=L('en','zh');

    store.write('language',language);
    renderShell(); return;
  }
  if (name==='sound') { muted=!muted; store.write('muted',muted); renderShell(); tone(); return; }

  if (name==='restart'||name==='next'||name.startsWith('level-')) {
    const level=name==='next'?run.current+1:name==='restart'?run.current:Number(name.slice(6));

  }
  if (name==='levels') { run.view='levels'; renderPlay(); qs('#overlay .current')?.focus({preventScroll:true}); return; }
  if (name==='close') { run.view=''; renderPlay(); return; }
  if (name==='undo'&&run.status!=='won') {
    const previous=run.history.pop();
    if (previous && run.status!=='won') {

      run.status='playing'; run.view=''; run.note=null; tone(); renderPlay();
    }

  }
  if (run.status!=='playing'||run.view) return;
  if (name==='hint') { run.hint=!run.hint; run.note=run.hint?run.engine.hint(run.state):null; renderPlay(); return; }

const directionNames = [['北','north'],['东','east'],['南','south'],['西','west']];
function ray(n, index, direction) {
  const [dx,dy]=deltas[direction], result=[];
  let x=index%n+dx, y=Math.floor(index/n)+dy;
  while(x>=0&&y>=0&&x<n&&y<n) {result.push(y*n+x);x+=dx;y+=dy;}
  return result;
}
function busBlocker(s, bus) {
  return ray(s.n,bus.index,bus.direction).find(i=>s.buses.some(other=>other.index===i));
}
function boardPassengers(s) {
  while(s.queue.length) {
    const bus=s.berths.find(vehicle=>vehicle.kind===s.queue[0]);
    if(!bus) break;
    s.queue.shift(); bus.seats--;
    if(!bus.seats) {s.berths.splice(s.berths.indexOf(bus),1);s.departed++;}
  }
}
engines['ferry-queue'] = {
  instructions:['点击出口畅通的车。接驳车只接队首同色乘客，候车位满了就会堵站。','Tap a shuttle with a clear exit. It can only load matching passengers from the front of the queue. Keep a berth free.'],
  create(level) {
    const random=rng(level*43609), n=level<22?5:level<76?6:7;
    const quota=Math.min(n*n-4,5+Math.floor(level/8));
    const buses=[];
    const directions=[0,1,2,3];
    for(let id=0;id<quota;id++) {
      const grid=Array(n*n).fill(false);
      for(const bus of buses)grid[bus.index]=true;
      const candidates=[];
      for(let index=0;index<grid.length;index++) if(!grid[index]) for(const direction of directions) {
        if(ray(n,index,direction).some(pos=>grid[pos])) continue;
        const blocks=buses.some(bus=>ray(n,bus.index,bus.direction).includes(index));
        const inward=ray(n,index,direction).length;
        candidates.push({index,direction,priority:random()+(blocks?.49:0)+(inward?.21:0)});
      }
      if(!candidates.length) break;
      candidates.sort((a,b)=>b.priority-a.priority);
      const {index,direction}=candidates[0];
      buses.push({id,index,direction,kind:Math.floor(random()*(level<8?3:level<45?4:6)),seats:2+(level>2&&random()>.63?1:0)});
    }
    const order=[...buses].reverse();
    return {n,buses,berths:[],slots:level<5?3:2,queue:order.flatMap(bus=>Array(bus.seats).fill(bus.kind)),
      departed:0,total:buses.length,plan:order.map(bus=>bus.id)};
  },
  board(s,run) {
    const ready=this.best(s);
    const moving=run.motion?.bus;
    const vehicle=bus=>`<span>${headings[bus.direction]}</span><small>${marks[bus.kind]}${bus.seats}</small>`;
    return `<div class="room ferry-room">
      <div class="passenger-area"><strong>${L('候车队','PASSENGERS')}</strong><div class="passengers">${s.queue.slice(0,10).map((kind,i)=>`<span class="passenger ${i===0?'first':''}" ${ink(kind)}>${marks[kind]}</span>`).join('')}${s.queue.length>10?`<small>+${s.queue.length-10}</small>`:''}</div></div>
      <div class="lot" style="--side:${s.n}">${Array.from({length:s.n*s.n},(_,i)=>{
        const bus=s.buses.find(piece=>piece.index===i);
        if(!bus)return '<div class="parking"></div>';
        const blocked=busBlocker(s,bus)!==undefined;
        return act(vehicle(bus),'bus-'+bus.id,
          'shuttle'+(blocked?' blocked':'')+(run.hint&&ready===bus.id?' highlight':''),`${ink(bus.kind)} aria-label="${T(colorNames[bus.kind])} · ${T(directionNames[bus.direction])} · ${bus.seats}"`);
      }).join('')}${moving?`<div class="shuttle moving" aria-hidden="true"
        style="--piece:${colors[moving.kind]};--col:${moving.index%s.n};--row:${Math.floor(moving.index/s.n)};--dx:${deltas[moving.direction][0]};--dy:${deltas[moving.direction][1]};--reach:${ray(s.n,moving.index,moving.direction).length+1}">
        ${vehicle(moving)}</div>`:''}</div>
      <div class="berths">${Array.from({length:s.slots},(_,i)=>s.berths[i]?`<div class="berth in-use" ${ink(s.berths[i].kind)}>${marks[s.berths[i].kind]} · ${s.berths[i].seats} ${L('座','seats')}</div>`:`<div class="berth">${L('空车位','Free berth')}</div>`).join('')}</div></div>`;
  },
  panel:s=>`<div class="metrics">${stat(L('已发车','DEPARTED'),`${s.departed}<i> / ${s.total}</i>`)}${stat(L('剩余乘客','WAITING'),s.queue.length)}</div>`,
  best(s) {
    const next=s.plan.map(id=>s.buses.find(bus=>bus.id===id)).find(bus=>bus&&bus.kind===s.queue[0]&&busBlocker(s,bus)===undefined);
    return next?.id;
  },
  hint(s) {
    return this.best(s)!==undefined?['高亮车辆出口畅通，能接队首乘客。','The highlighted shuttle has a clear exit and matches the next passenger.']:['先移走堵在同色车前的车，注意保留车位。','Free the matching shuttle first, and keep a spare berth.'];
  },
  handle(name,s) {
    if(!name.startsWith('bus-'))return;
    const id=Number(name.slice(4)), bus=s.buses.find(piece=>piece.id===id);
    if(!bus)return;
    const leaves=bus.kind===s.queue[0];
    active(name,state=>{
      if(busBlocker(state,bus)!==undefined){note('车头前方还有车。','Another shuttle is blocking this exit.');return false;}
      const index=state.buses.findIndex(piece=>piece.id===id);
      state.berths.push(state.buses.splice(index,1)[0]);
      session.motion={bus:{...bus}};
      const before=state.departed;
      boardPassengers(state);
      if(state.departed>before)note('接驳车满员出发。','A full shuttle departed.');
      return true;
    },leaves?1:0);
  },
  result:s=>!s.queue.length?'won':s.berths.length===s.slots?'lost':'playing',
  failure:['候车位已满，队首乘客找不到同色车。','All berths are occupied and no shuttle matches the next passenger.'],
  summary:s=>L(`${s.total} 辆车全部出发，候车队清空。`,`All ${s.total} shuttles departed. The queue is clear.`)
};
