<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Launch game in English</title><style>body{margin:40px;background:#0b1020;color:#eef2ff;font:18px/1.7 system-ui}a{color:#9ee4d2}</style></head><body><p id="status">Opening your game in English…</p><p><a id="continue" href="./">Back to the games</a></p><script>
const games={bloom:{path:'../bloom-rings/',key:'br_lang'},football:{path:'../football-draft/',key:'dd_lang'},perfect:{path:'../gridiron-draft/'}};const key=new URLSearchParams(location.search).get('game');if(Object.hasOwn(games,key)){const g=games[key];try{if(g.key)localStorage.setItem(g.key,'en')}catch{}const a=document.getElementById('continue');a.href=g.path;a.textContent='Continue to the game';location.replace(g.path)}else document.getElementById('status').textContent='Choose a game from the English collection.';
