<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#122731">
<title>Cooling Crisis</title>
<style>
  :root{font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;color:#152b35;background:#e8edd0;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:radial-gradient(circle at 1px 1px,#25404920 1px,transparent 1.3px) 0 0/8px 8px,#e8edd0}
  main{width:min(790px,100%);margin:auto;padding:18px 13px 26px}
  header{display:flex;align-items:end;justify-content:space-between;gap:9px;margin-bottom:11px}
  h1{margin:0;font-weight:950;font-size:clamp(32px,7vw,62px);line-height:.96;letter-spacing:-.07em;text-shadow:2px 2px #f0a951}
  button,select{font:inherit;color:inherit;border:2px solid #152b35;border-radius:8px;background:#ffdf7f;min-height:44px;padding:7px 12px;cursor:pointer;box-shadow:0 3px #152b35}
  button:hover{background:#f7efbc}
  button:active{box-shadow:0 1px #152b35;transform:translateY(2px)}
  button:focus-visible,select:focus-visible{outline:3px solid #d94e39;outline-offset:3px}
  .right{display:flex;gap:6px}
  .hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin:0 0 5px;text-align:center;color:#f1ffe2;background:#182b36;border:3px solid #182b36;border-radius:8px;font:700 12px/1.15 system-ui}
  .hud div{min-width:0;background:#294754;border-radius:4px;padding:6px 2px}
  .hud span{display:block;color:#ffe295;font-size:19px}
  .sheet{position:relative;background:#182c37;border:4px solid #172a35;box-shadow:0 7px #243b4594;border-radius:12px;overflow:hidden}
  canvas{width:100%;height:auto;aspect-ratio:640/400;display:block;touch-action:none}
  .screen{position:absolute;inset:0;display:grid;place-items:center;background:#11252caf;padding:9px}
  .screen[hidden]{display:none}
  .speech{background:#fff2bd;border:3px solid #0d2532;box-shadow:5px 6px #0d2532;border-radius:11px;padding:clamp(8px,3vw,19px);width:min(440px,96%);text-align:center}
  h2{font-size:clamp(21px,5vw,39px);margin:0 0 4px;letter-spacing:-.045em;line-height:1}
  .speech p{margin:7px 0;line-height:1.25;font-size:clamp(12px,2.2vw,16px)}
  .speech button{background:#66cdb2;font-weight:900}
  .speech select{margin-right:6px;background:#fff8d8}
  .controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px;min-height:50px}
  #vent{user-select:none;touch-action:none;color:#fff;background:#d24732;font-weight:900;min-width:95px}
  #status{font-size:13px;margin:0;line-height:1.26}
  @media(max-width:410px){main{padding-top:10px}.speech select,.speech button{min-height:33px;font-size:12px;padding:4px 8px}header button{min-height:39px;font-size:12px}}
</style>
<main>
<header><h1>Cooling Crisis</h1><div class="right"><button id="sound" aria-pressed="true">Sound</button><button id="pause" disabled>Pause</button></div></header>
<section class="hud" aria-label="Round status"><div>RACKS VENTED<span id="served">0 / 8</span></div><div>COOLANT<span id="ammo">◆◆◆</span></div><div>TIME LEFT<span id="timer">55s</span></div></section>
<section class="sheet">
  <canvas id="floor" width="640" height="400" aria-label="Move the cooling cart between chip racks and the refill pump"></canvas>
  <div class="screen" id="screen"><div class="speech">
    <h2 id="headline">Keep the chips cool!</h2>
    <p id="brief">During a shake-up at Relay Chip Co., it falls to your cart to keep the fab running.</p>
    <select id="mode" aria-label="Difficulty"><option value="0">Shift</option><option value="1">Crunch</option><option value="2">Redline</option></select><button id="start">Start shift</button>
  </div></div>
</section>
<div class="controls"><p id="status">WASD or tap to steer. Get beside a hot rack and hold Space or VENT. Return to the pump to refill.</p><button id="vent">VENT</button></div>
</main>
<script>
(() => {
  const by=(id)=>document.getElementById(id);
  const canvas=by('floor'), ctx=canvas.getContext('2d');
  const profiles=[
    {target:8,time:55,heat:.93,boost:160},
    {target:10,time:52,heat:1.14,boost:172},
    {target:12,time:50,heat:1.32,boost:182},
  ];
  const rackSpots=[[211,102],[444,103],[518,279],[317,301]];
  const tanks={x:92,y:282};
  const outline='#142c36';
  const keys=new Set();
  let vent=false, last=performance.now(), audio, muted=false, state, statusMessage='';
  const clamp=(value,a,b)=>Math.max(a,Math.min(b,value));
  const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const color=(heat)=>heat<49?'#478e7f':heat<74?'#e7ab3f':'#dc5946';
  const saveKey='relay-chip.cooling-crisis.records';
  function best(){
    try{return JSON.parse(localStorage.getItem(saveKey)||'{}')||{};}catch{return {};}
  }
  function note(frequency,kind='triangle',duration=.09){
    if(muted) return;
    try{
      audio??=new AudioContext();
      if(audio.state==='suspended') void audio.resume().catch(()=>{});
      const oscillator=audio.createOscillator(), gain=audio.createGain(), time=audio.currentTime;
      oscillator.type=kind;oscillator.frequency.setValueAtTime(frequency,time);
      oscillator.frequency.exponentialRampToValueAtTime(frequency*.82,time+duration);
      gain.gain.setValueAtTime(.075,time);gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
      oscillator.connect(gain).connect(audio.destination);oscillator.start(time);oscillator.stop(time+duration);
    }catch{}
  }
  function fresh(mode){
    const rules=profiles[mode];
    return {mode,rules,time:rules.time,phase:'playing',served:0,ammo:3,charge:0,refill:0,age:0,
      player:{x:95,y:100,face:1},destination:null, particles:[],flash:0,
      racks:rackSpots.map(([x,y],index)=>({x,y,heat:[65,55,47,51][index]+mode*3,served:0}))};
  }
  function start(){
    state=fresh(Number(by('mode').value));resetInput();
    last=performance.now();statusMessage='';
    by('screen').hidden=true;by('pause').disabled=false;by('pause').textContent='Pause';
    note(440);hud();
  }
  function resetInput(){keys.clear();vent=false;}
  function end(won,reason){
    state.phase='result';resetInput();by('screen').hidden=false;by('pause').disabled=true;
    const records=best(), prior=records[state.mode];
    if(won&&(!Number.isFinite(prior)||state.time>prior)){
      records[state.mode]=state.time;
      try{localStorage.setItem(saveKey,JSON.stringify(records));}catch{}
    }
    by('headline').textContent=won?'Factory saved!':'Shift over';
    by('brief').textContent=won?'You vented '+state.served+' racks with '+Math.ceil(state.time)+'s to spare.':reason+' Vent earlier or plan a shorter refill route.';
    by('start').textContent='Play again';note(won?698:133,won?'triangle':'sawtooth',.24);
  }
  function pause(){
    if(state?.phase==='paused'){
      state.phase='playing';by('screen').hidden=true;by('pause').textContent='Pause';last=performance.now();
    }else if(state?.phase==='playing'){
      state.phase='paused';resetInput();by('screen').hidden=false;by('headline').textContent='Shift paused';
      by('brief').textContent='The fab timer is paused.';by('pause').textContent='Resume';by('start').textContent='Resume';
    }
  }
  function hud(){
    const update=(id,value)=>{const item=by(id);if(item.textContent!==value) item.textContent=value;};
    update('served',state.served+' / '+state.rules.target);
    update('ammo','◆'.repeat(state.ammo)+'◇'.repeat(3-state.ammo));
    update('timer',Math.ceil(state.time)+'s');
    if(statusMessage) update('status',statusMessage);
  }
  function burst(x,y,shade){
    for(let i=0;i<16;i++){
      const angle=i*.3927, speed=14+(i%6)*16;
      state.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,t:.42+i*.018,shade});
    }
  }
  function tick(dt){
    const s=state, p=s.player;
    s.age+=dt;s.time=Math.max(0,s.time-dt);s.flash=Math.max(0,s.flash-dt);
    let dx=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'));
    let dy=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));
    if(dx||dy) s.destination=null;
    else if(s.destination){
      const distanceLeft=distance(p,s.destination);
      if(distanceLeft<5) s.destination=null;
      else{dx=s.destination.x-p.x;dy=s.destination.y-p.y;}
    }
    const length=Math.hypot(dx,dy);
    if(length){
      p.x=clamp(p.x+dx/length*s.rules.boost*dt,28,612);
      p.y=clamp(p.y+dy/length*s.rules.boost*dt,45,374);
      if(Math.abs(dx)>0.05) p.face=Math.sign(dx);
    }
    const atPump=distance(p,tanks)<48;
    if(atPump&&s.ammo<3){
      s.refill+=dt;
      if(s.refill>=.46){s.refill=0;s.ammo++;burst(tanks.x,tanks.y-13,'#73d9bb');note(590);}
    }else s.refill=0;
    for(const [i,rack] of s.racks.entries()){
      const rate=(1.08+i*.09+.35*(.5+.5*Math.sin(s.age*.76+i)))*s.rules.heat;
      rack.heat+=rate*dt;
    }
    const nearest=s.racks.reduce((a,b)=>distance(p,a)<distance(p,b)?a:b);
    const brushing=distance(p,nearest)<57, cooling=(vent||keys.has('Space'))&&brushing&&s.ammo>0&&nearest.heat>=29;
    if(cooling){
      s.charge+=dt;
      if(s.charge>=.38){
        s.charge=0;s.ammo--;s.served++;nearest.heat=Math.max(12,nearest.heat-40);nearest.served++;
        s.flash=.25;burst(nearest.x,nearest.y,'#8ae1c4');note(352,'triangle',.19);
      }
    }else s.charge=0;
    for(const fx of s.particles){fx.x+=fx.vx*dt;fx.y+=fx.vy*dt;fx.t-=dt;}
    s.particles=s.particles.filter((fx)=>fx.t>0);
    const threat=s.racks.some((rack)=>rack.heat>=74);
    statusMessage=atPump&&s.ammo<3?'Refilling coolant…':s.ammo===0?'Dry tank! Steer to the mint PUMP.':brushing&&nearest.heat>=29?'In range. Hold VENT to cool this rack.':threat?'A red rack is close to overheating. Get there first.':'Tap the floor to steer or use WASD. Vent orange or red racks.';
    hud();
    if(s.served>=s.rules.target){end(true);return;}
    if(s.racks.some((rack)=>rack.heat>=100)) end(false,'A rack overheated.');
    else if(s.time<=0) end(false,'Time ran out.');
  }
  function rect(x,y,w,h,r,fill,edge=outline,width=2){
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
    if(edge){ctx.strokeStyle=edge;ctx.lineWidth=width;ctx.stroke();}
  }
  function disk(x,y,r,fill,edge=outline){
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
    if(edge){ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();}
  }
  function label(text,x,y,size=13,fill=outline){
    ctx.textAlign='center';ctx.font='900 '+size+'px Trebuchet MS,sans-serif';ctx.fillStyle=fill;ctx.fillText(text,x,y);
  }
  function draw(){
    const s=state;
    ctx.fillStyle='#d6c78e';ctx.fillRect(0,0,640,400);
    ctx.strokeStyle='#a899675e';
    for(let x=0;x<640;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke();}
    for(let y=0;y<400;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke();}
    rect(7,7,626,385,10,'#e8db9b39','#19323e',4);
    rect(29,19,121,29,5,'#f7e8a3');
    label('RELAY CHIP CO.',89,38,14);
    ctx.setLineDash([9,7]);ctx.lineWidth=3;ctx.strokeStyle='#49645784';ctx.strokeRect(151,51,418,295);ctx.setLineDash([]);
    for(const [i,rack] of s.racks.entries()){
      const {x,y,heat}=rack, shade=color(heat);
      rect(x-34,y-24,68,48,5,'#284552');
      rect(x-26,y-18,52,30,3,shade);
      for(let k=0;k<4;k++) rect(x-20+k*11,y-10,6,15,2,'#fff3ab',null);
      rect(x-32,y+17,64,10,2,'#17303a');
      rect(x-30,y+19,60*clamp(heat/100,0,1),6,1,shade,null);
      label('RACK '+(i+1),x,y+44,13);
      if(heat>=74){
        const radius=35+(Math.sin(s.age*5)+1)*3;
        ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.strokeStyle='#d94d3c';ctx.lineWidth=2;ctx.stroke();
        label('!',x+41,y-23,25,'#ac3326');
      }
    }
    const {x:tx,y:ty}=tanks;
    rect(tx-28,ty-28,56,54,14,'#578d78');
    rect(tx-19,ty-19,37,36,9,'#a3e6b9');
    label('PUMP',tx,ty+43,17);
    if(s.destination){
      disk(s.destination.x,s.destination.y,7,'#fff0aa','#386e6b');
      disk(s.destination.x,s.destination.y,2,'#386e6b',null);
    }
    const {x,y,face}=s.player;
    rect(x-18,y-12,36,25,7,s.flash>0?'#95ebbd':'#ef935c',outline,3);
    disk(x-11,y+13,5,'#49606b');disk(x+11,y+13,5,'#49606b');
    rect(x-13,y-10,26,15,6,'#fff4be');
    disk(x+face*4,y-5,2.6,outline,null);disk(x-face*5,y-5,2.6,outline,null);
    rect(x+face*15-4,y-5,8,7,2,'#6ed4b4');
    if(s.charge>0){
      ctx.beginPath();ctx.arc(x,y,24,-Math.PI/2,-Math.PI/2+Math.PI*2*s.charge/.38);ctx.strokeStyle='#ffffc5';ctx.lineWidth=4;ctx.stroke();
    }
    for(const fx of s.particles) disk(fx.x,fx.y,2+fx.t*4,fx.shade,null);
  }
  function frame(now){
    const dt=clamp((now-last)/1000,0,.04);last=now;
    if(state.phase==='playing') tick(dt);
    draw();requestAnimationFrame(frame);
  }
  canvas.addEventListener('pointerdown',(event)=>{
    if(state.phase!=='playing') return;
    const bounds=canvas.getBoundingClientRect();
    state.destination={x:clamp((event.clientX-bounds.left)*640/bounds.width,28,612),
      y:clamp((event.clientY-bounds.top)*400/bounds.height,45,374)};
  });
  by('vent').addEventListener('pointerdown',(event)=>{by('vent').setPointerCapture(event.pointerId);vent=true;});
  for(const type of ['pointerup','pointercancel','lostpointercapture']) by('vent').addEventListener(type,()=>{vent=false;});
  window.addEventListener('keydown',(event)=>{
    if(event.code==='Escape'){if(!event.repeat) pause();return;}
    if(state.phase!=='playing'||event.target instanceof HTMLSelectElement) return;
    if(event.code.startsWith('Arrow')||event.code==='Space') event.preventDefault();
    keys.add(event.code);
  });
  window.addEventListener('keyup',(event)=>keys.delete(event.code));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='playing') pause();});
  window.addEventListener('blur',()=>{if(state.phase==='playing') pause();});
  by('start').addEventListener('click',()=>state.phase==='paused'?pause():start());
  by('pause').addEventListener('click',pause);
  by('sound').addEventListener('click',()=>{
    muted=!muted;by('sound').textContent=muted?'Muted':'Sound';
    by('sound').setAttribute('aria-pressed',String(!muted));if(!muted) note(420);
  });
  state=fresh(0);state.phase='home';hud();
  if(new URLSearchParams(location.search).has('qa')) window.coolingQA=()=>({phase:state.phase,player:{...state.player},ammo:state.ammo,time:state.time,served:state.served,
    racks:state.racks.map((rack)=>({...rack})),tank:{...tanks}});
  requestAnimationFrame(frame);
})();
</script>
</html>
