<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b40"><title>弹珠接力 · Marble Relay</title><link rel="stylesheet" href="style.css"><script defer src="../../analytics.js" data-game="marble-relay" data-release="web-20261120-r2"></script></head><body><main><header><a href="https://kindwolf-labs.github.io/play/lab/">← 游戏合集</a><button id="helpBtn">怎么玩</button></header><div class="brand">MARBLE RELAY / 一杆点亮一路</div><h1>弹珠接力<span>找到角度，让微光继续。</span></h1><div class="headline"><div><small id="chapter"></small><strong id="level"></strong></div><button id="map">星图选关</button></div><section class="meters"><span>接力点 <b id="lit"></b></span><span>已试 <b id="attempts"></b> 杆</span><span id="angleLabel">拖动瞄准</span></section><div class="arena"><svg id="board" viewBox="0 0 420 560" role="application" aria-label="弹珠接力球桌；从底部弹珠向目标拖动瞄准，松手发射"></svg><div class="ribbon">按 1 → 2 → 3 的顺序点亮，最后进金色终点</div></div><p id="status" role="status"></p><div class="aim"><label>精调角度 <input type="range" id="angle" min="-180" max="180" step="0.25" value="-90" aria-label="发射角度"></label><button id="fire">发射 ↗</button></div><div class="actions"><button id="undo">↶ 撤回一杆</button><button id="restart">重新开始</button><button id="hint">方向提示</button></div><section id="win" hidden><div id="stars"></div><h2 id="winTitle"></h2><p id="winText"></p><button id="next">下一关 →</button></section><details id="help"><summary>一根手指，也能看懂的一杆</summary><p>按住球桌底部的白色弹珠，向你想发射的方向拖动，松手出杆。也可以点选方向、调角度后按“发射”。先依次经过蓝色编号接力点，再进金色终点。墙面与珊瑚挡板都会反弹，白色短虚线只显示出射方向。每次失手保留轨迹，观察先经过哪里，再微调角度。没有强制体力或付费；可无限重试。拖动取消不会出杆，撤回一杆会恢复上次试打前的状态。回到后台将暂停动画。</p></details><p id="saveStatus"></p><footer><a href="https://kindwolf-labs.github.io/play/lab/privacy.html">隐私说明</a><a href="https://github.com/kindwolf-labs/play/issues/new">问题反馈</a></footer></main><dialog id="mapDialog"><div class="dialogHead"><h2>150 道接力星图</h2><button id="closeMap" aria-label="关闭星图">×</button></di
