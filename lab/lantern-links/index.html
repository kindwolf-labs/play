<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a31"><title>Lantern Links · 灯笼连线</title><link rel="stylesheet" href="style.css"></head><body><main>
