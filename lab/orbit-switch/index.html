<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101832"><title>星轨共振</title><link rel="stylesheet" href="style.css"><script defer src="../../analytics.js" data-release="495137e8edf6"></script></head><body>
<main><header><a href="https://kindwolf-labs.github.io/play/lab/">← 游戏合集</a><button id="help" aria-label="游戏说明">玩法说明</button></header>
<section class="intro"><p>ORBIT SWITCH</p><h1>星轨共振 <span>✦</span></h1><div>转动星环，让每束光对准它的星标。</div></section>
<div class="toolbar"><button id="choose">选择关卡</button><strong id="level"></strong><button id="reset">重新开始</button></div>
<section class="board" aria-label="星环棋盘"><div id="rings"></div><div id="core">✦<small>共振核心</small></div></section>
<div class="info"><span id="rules"></span><strong id="moves"></strong></div>
<div id="controls" class="controls" aria-label="转动星环"></div><div class="actions"><button id="undo">撤销</button><button id="hint">提示</button></div>
<p id="status" role="status" aria-live="polite"></p><div id="complete" class="complete" hidden><h2>共振成功 ✨</h2><p id="result"></p><button id="next">下一关</button><button id="replay">再玩一次</button></div>
<details id="instructions"><summary>玩法与操作</summary><p>星环由内向外编号。每一圈有一颗移动光点和固定星标，使用对应的左右按钮旋转。第 11 关起，转动一圈时，紧邻外侧的一圈会反方向转动；最外圈没有联动。全部光点对准各自星标即可过关。可撤销、重开或使用提示。进度仅保存在本设备。</p></details>
