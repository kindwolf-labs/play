<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d2b"><title>磁力工坊 · Magnet Foundry</title><link rel="stylesheet" href="style.css"><script defer src="../../analytics.js" data-release="880b96d79d78"></script></head><body><main><header><a href="https://kindwolf-labs.github.io/play/lab/">← 游戏合集</a><button id="help">玩法说明</button></header><section class="intro"><span class="eyebrow">MAGNET FOUNDRY</span><h1>磁力<span>工坊</span><i>✦</i></h1><p>一推，一引。让磁芯停在光里。</p></section><section class="dashboard"><div><small id="chapter"></small><h2 id="level"></h2></div><button id="map">关卡地图</button></section><div class="metrics"><span>脉冲 <b id="moves">0</b></span><span>三星 <b id="par"></b></span><span>剩余 <b id="budget"></b></span></div><section class="machine" aria-label="磁场实验台"><button class="coil north" data-side="0"></button><div class="board-row"><button class="coil west" data-side="3"></button><div id="board" role="img" aria-label="磁芯、挡板与目标"></div><button class="coil east" data-side="1"></button></div><button class="coil south" data-side="2"></button></section><p id="status" role="status"></p><div class="actions"><button id="undo">↶ 撤销</button><button id="reset">↻ 重开</button><button id="hint">✦ 提示</button></div><section id="result" hidden><span class="stars" id="stars"></span><h2 id="resultTitle"></h2><p id="resultText"></p><button id="next">下一关 →</button></section><details id="rules"><summary>磁场怎么工作？</summary><p>磁芯始终是 N 极。点击四边的磁铁发出一次脉冲：S 极吸引磁芯朝自己移动，N 极排斥磁芯朝反方向移动，直到挡板或边缘。每次有效移动后，这块磁铁自动交换 N/S 极。让磁芯最终停在金色靶心；滑过靶心不算完成。没有移动的操作不计步，也不换极。</p><p>先看按钮上的箭头，再判断滑行方向。规划挡板的停靠位置，再考虑下一次反转。可用键盘 W/D/S/A 启动上/右/下/左磁铁；撤销和提示会影响星级。</p></details><footer><span id="save"></span><div><a href="https://kindwolf-labs.github.io/play/lab/privacy.html">隐私说明</a><a href="https://github.com/kindwolf-labs/play/issues/new">反馈问题</a></div></footer></main><dialog id="mapDialog"><div class="map-head"><h2>磁场档案</h2><button id="closeMap" aria-label="关闭选关">×</button></div><nav><button id="prevPage">←</button><b id="mapChapter"></b><button id="nextPage">→</button></nav><div id="levels"></div></dialog><script type="module" src="game.js"></script></body></html>
