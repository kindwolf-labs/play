<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8f0df"><title>包裹分拣站</title><link rel="stylesheet" href="style.css"><script defer src="../../analytics.js" data-release="7f67eb4aa739"></script></head><body><main><header><p class="eyebrow">PARCEL PLATFORM</p><h1>包裹分拣站</h1><p>选对传送带，按顺序发出包裹。</p></header><section id="menu" class="card"><h2>准备发车</h2><p>三条传送带每次只能取最前面的包裹。按编号从小到大发送；暂时不能发出的包裹会进入有限的暂存架。</p><p>暂存架满时，需要先发送架上正确的包裹。走错了可撤销，卡住了可重开或查看提示。</p><button id="start">继续游戏</button><label>选择已解锁关卡 <select id="select"></select></label><p id="progress"></p></section><section id="play" class="card" hidden><div class="top"><strong id="level"></strong><span id="goal"></span></div><p id="message" aria-live="polite"></p><div id="lanes" class="lanes"></div><h3>暂存架 <span id="capacity"></span></h3><div id="rack" class="rack"></div><div class="actions"><button id="undo" class="secondary">撤销</button><button id="restart" class="secondary">重开</button><button id="hint" class="secondary">提示</button><button id="home" class="secondary">选关</button></div></section><section id="win" class="card" hidden><h2 id="win-title"></h2><p id="win-copy"></p><button id="next">下一关</button><button id="win-home" class="secondary">返回选关</button></section><footer><a href="https://kindwolf-labs.github.io/play/lab/privacy.html">隐私说明</a> · <a href="https://github.com/kindwolf-labs/play/issues/new">反馈问题</a></footer></main><script type="module" src="game.js"></script></body></html>
