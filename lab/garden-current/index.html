<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dff0ed"><title>Garden Current · 花园水路</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><a href="https://kindwolf-labs.github.io/play/lab/">KINDWOLF / PLAY</a><div class="settings"><button id="sound" aria-label="Toggle sound">♪ Off</button><button id="language" aria-label="Switch language">中文</button></div></header>
<section class="intro"><span id="eyebrow">A LITTLE WATER. A WORLD OF BLOOM.</span><h1 id="title">Garden Current</h1><p id="subtitle">Turn the pipes. Bring your garden to life.</p><div class="decor" aria-hidden="true">✿</div></section>
<section class="game"><div class="levelbar"><div><span id="chapter"></span><h2 id="levelName"></h2></div><button id="map">150 gardens ↗</button></div>
<div class="meters"><div><small id="flowersLabel">FLOWERS</small><strong id="flowers"></strong></div><div><small id="leaksLabel">LEAKS</small><strong id="leaks"></strong></div><div><small id="movesLabel">TURNS</small><strong id="moves"></strong></div></div>
<div class="garden"><div id="board" class="board" role="group" aria-label="Garden pipe puzzle"></div><div id="win" class="win" hidden><span aria-hidden="true">✿</span><h2 id="winTitle"></h2><div id="stars"></div><p id="winCopy"></p><button id="next" class="primary"></button></div></div>
<p id="status" class="status" role="status" aria-live="polite"></p><div class="tools"><button id="undo">↶ Undo</button><button id="hint">✦ Hint</button><button id="restart">↻ Restart</button></div><div class="runmeta"><span id="par"></span><span id="best"></span><span id="time">0:00</span></div></section>
<details id="rules" open><summary id="rulesTitle">How the garden grows</summary><p id="rulesCopy"></p></details><p id="saveNotice" class="save-notice" role="status"></p><footer id="footer"></footer>
<nav aria-label="Privacy and feedback / 隐私与反馈" style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:20px 0 6px;font-size:12px;line-height:1.8"><a href="https://kindwolf-labs.github.io/play/lab/privacy.html" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;text-underline-offset:3px">Privacy / 隐私</a><a href="https://github.com/kindwolf-labs/play/issues/new" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;text-underline-offset:3px">Feedback / 反馈</a></nav>
</main><dialog id="mapDialog"><div class="map-head"><h2 id="mapTitle"></h2><button id="closeMap" aria-label="Close level map">×</button></div><nav class="page-nav"><button id="prevPage" aria-label="Previous chapter">←</button><span id="pageTitle"></span><button id="nextPage" aria-label="Next chapter">→</button></nav><div id="levelGrid" class="level-grid"></div><p id="progress"></p></dialog><script type="module" src="game.js"></script></body></html>
