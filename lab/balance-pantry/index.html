<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eddd"><meta name="description" content="用两只量杯分出刚好的谷物，给下一份订单留好原料。150关原创称量解谜。"><title>称量配餐 · Balance Pantry</title><link rel="stylesheet" href="style.css"><script defer src="../../analytics.js" data-game="balance-pantry" data-release="web-20261120"></script></head><body><main><header><a href="https://kindwolf-labs.github.io/play/lab/">← 游戏合集</a><button id="map">选关</button></header><section class="intro"><span>BALANCE PANTRY</span><h1>称量<span>配餐</span><i>✧</i></h1><p>倒出刚刚好，也给下一单留一点。</p></section><section class="order-head"><div><small id="chapter"></small><h2 id="level"></h2></div><div id="orders"></div></section><section class="bench"><button id="stock" class="stock" aria-label="原料罐：装满选中量杯"><span class="jar-icon">♧</span><span>今日原料 <b id="stockAmount"></b><small>点击装杯 · 用完不补</small></span></button><div class="scale"><div class="plate" id="plate" role="button" tabindex="0" aria-label="将选中量杯倒入餐盘"><div class="food" id="food"></div><span id="plateWeight"></span></div><div class="scale-neck"></div><div class="scale-base"><div class="dial"><div id="needle"></div><span>−　 ·　＋</span></div><strong id="difference"></strong><small>目标 <b id="target"></b></small></div></div><div class="cups"><button class="cup-item selected" data-cup="a" aria-label="选择A量杯"><span class="cup-tag">A 杯</span><span class="cup" id="cupA"><span class="liquid" id="liquidA"></span><span class="ticks"></span><b id="amountA"></b></span><small id="capacityA"></small></button><button class="cup-item" data-cup="b" aria-label="选择B量杯"><span class="cup-tag">B 杯</span><span class="cup" id="cupB"><span class="liquid" id="liquidB"></span><span class="ticks"></span><b id="amountB"></b></span><small id="capacityB"></small></button></div><p id="selection"></p><div class="pour-actions"><button id="fill">↓ 装满选中杯</button><button id="transfer">⇄ 倒给另一杯</button><button id="serve">↥ 倒入餐盘</button><button id="discard">倒掉杯中原料</button></div></section><p id="status" role="status"></p><section id="result" hidden><span id="stars"></span><h2 id="resultTitle"></h2><p id="resultText"></p><button id="continue">接下一单 →</button></section><div class="tools"><button id="undo">↶ 撤回</button><button id="reset">↻ 重来</button><button id="hint">✦ 一步提示</button></div><div class="steps"><span>倾倒 <b id="moves">0</b> 次</span><span>建议 <b id="par"></b> 次</span></div><details><summary>为什么这样倒？</summary><p>先点量杯选中它，再点原料罐装满，或倒向另一杯、餐盘。倒给另一杯时，到对方满杯或自己倒空为止；倒入餐盘则整杯倒入。刻度与差额按克显示，靶心刻度也保留。</p><p>原料有限，倒掉就回不来了；给下一单留在杯中的部分同样能使用。餐盘超量或剩余原料不足时，可以撤回。第一关先选择 A 杯装满，再倒入餐盘。键盘 1/2 选杯，F 装杯、T 转杯、P 入盘，Z 撤回。</p></details><footer><p id="save"></p><a href="https://kindwolf-labs.github.io/play/lab/privacy.html">隐私说明</a><a href="https://github.com/kindwolf-labs/play/issues/new">反馈问题</a></footer></main><dialog id="mapDialog"><div class="maphead"><h2>配餐手记</h2><button id="closeMap" aria-label="关闭选关">×</button></div><nav><button id="prevPage">←</button><b id="mapChapter"></b><button id="nextPage">→</button></nav><div id="levels"></div></dialog><script type="module" src="game.js"></script></body></html>
